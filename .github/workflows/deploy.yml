name: Build and Deploy React App to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Log in to DigitalOcean Container Registry
      - name: Log in to DigitalOcean Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ secrets.DOCKER_REGISTRY }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_REGISTRY }}/react-app:latest .

      # Push Docker image to registry
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_REGISTRY }}/react-app:latest

      # Deploy to Droplet
      - name: SSH and deploy to Droplet
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          port: 22
          script: |
            # Pull latest Docker image
            docker pull ${{ secrets.DOCKER_REGISTRY }}/react-app:latest

            # Stop existing container if exists
            if [ $(docker ps -q -f name=react-app) ]; then
              docker stop react-app
              docker rm react-app
            fi

            # Run new container
            docker run -d \
              --name react-app \
              -p 80:80 \
              -p 443:443 \
              ${{ secrets.DOCKER_REGISTRY }}/react-app:latest
