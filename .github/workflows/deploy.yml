name: Deploy Frontend (Vite + Nginx) to DigitalOcean

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DigitalOcean Container Registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE=${{ secrets.DOCKER_REGISTRY }}/fintech-frontend:latest
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          script: |
            IMAGE=${{ steps.build.outputs.image }}
            echo "Using image $IMAGE"

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker pull $IMAGE

            if [ $(docker ps -aq -f name=fintech-frontend) ]; then
              docker stop fintech-frontend
              docker rm fintech-frontend
            fi

            docker run -d \
              --name fintech-frontend \
              --restart unless-stopped \
              -p 80:80 \
              $IMAGE

            docker image prune -f