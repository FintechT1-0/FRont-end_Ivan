server {
    listen 80;
    listen [::]:80;
    server_name fintecheducation.online www.fintecheducation.online;
    
    return 301 https://$host$request_uri;
}

server {
    listen 443;
    listen [::]:443;
    server_name fintecheducation.online www.fintecheducation.online;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
