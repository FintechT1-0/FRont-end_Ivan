server {
    listen 80;
    listen [::]:80;

    server_name fintecheducation.online www.fintecheducation.online;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name fintecheducation.online www.fintecheducation.online;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/fintecheducation.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fintecheducation.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

    location / {
        try_files $uri /index.html;
    }
}
